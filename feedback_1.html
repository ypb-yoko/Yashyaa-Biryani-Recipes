<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Yashyaa Biryani</title>
   <link rel="stylesheet" href="feedback_style.css" type="text/css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#recipes">Recipes</a></li>
            </ul>
        </nav>
        <h1>Yashyaa Biryani Recipe's</h1>
    </header>

    <div class="container">
        <h2>We Value Your Flavor!</h2>
        <p style="text-align: center;">How was your biryani experience? Let us know!</p>
        <form>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Which recipe did you try?</label>
                <select>
                    <option>Chicken Biryani</option>
                    <option>Veg Biryani</option>
                    <option>Egg Biryani</option>
                </select>
            </div>
        <div class="form-group">
    <label>Your Rating (1-5)</label>
    <div class="rating-wrapper">
        <div class="rating-option">
            <input type="radio" id="r1" name="rating" value="1" required>
            <label for="r1">1</label>
        </div>
        <div class="rating-option">
            <input type="radio" id="r2" name="rating" value="2">
            <label for="r2">2</label>
        </div>
        <div class="rating-option">
            <input type="radio" id="r3" name="rating" value="3">
            <label for="r3">3</label>
        </div>
        <div class="rating-option">
            <input type="radio" id="r4" name="rating" value="4">
            <label for="r4">4</label>
        </div>
        <div class="rating-option">
            <input type="radio" id="r5" name="rating" value="5">
            <label for="r5">5</label>
        </div>
    </div>
</div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Share your thoughts..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Feedback</button>
        </form>
    </div>

    <footer>
        <address>Yashraj Boriwar<br>ZCOER</address> 
    </footer>
</body>
</html>
